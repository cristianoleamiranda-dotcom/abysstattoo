  .mark { width:92px; height:92px; margin:0 auto 26px; display:block; }

  p { color:var(--crema2); }
  a.cta { display:inline-block; margin-top:28px; padding:14px 26px; border:1px solid var(--teal); color:var(--teal);
          text-decoration:none; letter-spacing:.12em; font-size:13px; text-transform:uppercase; }
  a.cta:hover { background:var(--teal); color:var(--negro); }
  small { display:block; margin-top:22px; color:#8F7F73; letter-spacing:.08em; font-size:12px; }

</head>
