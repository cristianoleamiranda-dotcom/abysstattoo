name: fetch-tmp-videos
on:
  push:
    paths:
      - '.github/workflows/fetch-tmp.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tmpfiles videos
        run: |
          set -euxo pipefail
          mkdir -p material/raw
          download_one() {
            local page_url="$1"
            local fallback_dl="$2"
            local out="$3"
            local page real
            page="$(curl -sSL -A 'Mozilla/5.0' --retry 3 --max-time 30 "$page_url" || true)"
            real="$(printf '%s' "$page" | grep -oE 'https://tmpfiles\.org/dl/[^"'"'"' >]+' | head -1 || true)"
            if [ -z "$real" ]; then
              real="$fallback_dl"
            fi
            echo "Downloading $out from $real"
            curl -fSL -A 'Mozilla/5.0' --retry 4 --retry-all-errors --max-time 300 -o "material/raw/$out" "$real"
            ls -lh "material/raw/$out"
            file "material/raw/$out"
          }
          download_one \
            "https://tmpfiles.org/w1AanxCb53sJ/abyss_promo_10s_1080x19203.mp4" \
            "https://tmpfiles.org/dl/1792522168.a2d405b64f334f71/w1AanxCb53sJ/abyss_promo_10s_1080x19203.mp4" \
            "abyss_promo_10s_1080x19203.mp4"
          download_one \
            "https://tmpfiles.org/wVA3nXC55RhU/abyss_promo_10s_1080x19202.mp4" \
            "https://tmpfiles.org/dl/1792522169.21886cfb8b42a5ca/wVA3nXC55RhU/abyss_promo_10s_1080x19202.mp4" \
            "abyss_promo_10s_1080x19202.mp4"
      - name: Push raw videos to session branch
        run: |
          git config user.name "arena-fetch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f material/raw/*.mp4
          git commit -m "chore: fetched raw promo videos"
          git push origin HEAD
