name: Inspect CapCut Activity SPA

on:
  push:
    branches:
      - arena/69de13c4-abysstattoo
    paths:
      - ".github/workflows/inspect-capcut.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Render CapCut Activity Page & Capture API JSON in Chromium
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m pip install --quiet --break-system-packages playwright
          python3 -m playwright install chromium
          python3 - <<'EOF' > /tmp/capcut_dump.txt 2>&1
          import json
          from playwright.sync_api import sync_playwright

          url = "https://www.capcut.net/imlv/inspire-activity?task_id=307926551812&language=es&region=CL&source=creator_task_center&mission_type=activity"
          api_payloads = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              ctx = browser.new_context(
                  locale="es-CL",
                  viewport={"width": 430, "height": 1400},
                  user_agent="Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1",
              )
              page = ctx.new_page()

              def on_resp(resp):
                  ct = resp.headers.get("content-type", "")
                  if "json" in ct or "activity" in resp.url or "task" in resp.url or "imlv" in resp.url:
                      try:
                          txt = resp.text()
                          if len(txt) < 40000 and ("{" in txt):
                              api_payloads.append({"url": resp.url, "status": resp.status, "body": txt[:8000]})
                      except Exception:
                          pass

              page.on("response", on_resp)
              page.goto(url, wait_until="networkidle", timeout=45000)
              page.wait_for_timeout(4000)
              print("=== PAGE TITLE ===")
              print(page.title())
              print("=== RENDERED TEXT ===")
              print(page.inner_text("body")[:15000])
              print("=== API PAYLOADS ===")
              for item in api_payloads:
                  print(f"\n--- {item['status']} {item['url']} ---")
                  print(item["body"])
              page.screenshot(path="/tmp/capcut_screen.jpg", full_page=True, type="jpeg", quality=82)
              browser.close()
          EOF
          BODY=$(head -c 60000 /tmp/capcut_dump.txt)
          gh api "/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY"

          git config user.name "Abyss Bot"
          git config user.email "bot@abysstattoo.cl"
          mkdir -p /tmp/shot_out
          cp /tmp/capcut_screen.jpg .capcut_preview_tmp.jpg || true
          git pull --rebase origin "${{ github.ref_name }}"
          git add .capcut_preview_tmp.jpg
          git commit -m "chore(tmp): capture capcut activity screenshot" || true
          git push origin "HEAD:${{ github.ref_name }}" || true
