name: "Abyss Studio — Media & Brand Audit Action"
description: >
  Acción personalizada (Composite Action) de Abyss Tattoo Studio que verifica
  integridad HTML, numeración oficial (José Joaquín Pérez 528), ausencia de promociones
  vencidas y especificaciones técnicas de video/audio (FFprobe BT.709, 60/30 fps, 15.00 s).

inputs:
  report-path:
    description: "Ruta donde guardar el reporte Markdown generado para resúmenes y comentarios PR"
    required: false
    default: "audit-report.md"

outputs:
  report-path:
    description: "Ruta final del reporte Markdown de auditoría"
    value: ${{ steps.audit.outputs.report_file }}

runs:
  using: "composite"
  steps:
    - name: Instalar FFmpeg / FFprobe si no está presente
      shell: bash
      run: |
        if ! command -v ffprobe >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
        fi

    - name: Ejecutar auditoría técnica de marca, enlaces y másters MP4
      id: audit
      shell: bash
      run: |
        python3 scripts/ci_audit_deliverables.py --output "${{ inputs.report-path }}"
        echo "report_file=${{ inputs.report-path }}" >> "$GITHUB_OUTPUT"
